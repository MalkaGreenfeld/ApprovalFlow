# ApprovalFlow — CI/CD pipeline
#
# M16 quality gates on every push · M17 automated tests in CI · N6 tests across
# layers (unit / integration / UI) · N2 a CD stage that publishes images once the
# gates are green, with no manual release step.
#
# The gates fail the build. They are not advisory: a missing test directory used
# to print "skipping" and pass, which meant a deleted test suite looked green.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: '3.12'

jobs:
  quality:
    name: Lint · types · tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: approvalflow
          POSTGRES_PASSWORD: approvalflow
          POSTGRES_DB: approvalflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The shared package pins the contracts, DB driver and JWT library that
          # every service shares, so installing it first keeps versions aligned.
          pip install -e "services/shared/[dev]"
          for service in ingestion agent router payment notification; do
            pip install -r "services/$service/requirements.txt"
          done
          pip install pytest pytest-asyncio pytest-cov mypy ruff hypothesis

      - name: Lint (ruff)
        # Configured by ruff.toml at the repo root so the result is identical here
        # and on a developer machine.
        run: ruff check services/ scripts/ eval/ tests/

      - name: Type check (mypy)
        run: mypy services/ --explicit-package-bases --ignore-missing-imports

      - name: Policy configuration is valid
        # A malformed policy document would make every service escalate everything
        # at run time. Catch it here instead.
        run: |
          python -c "
          from approvalflow.policy import load_bootstrap_config
          from approvalflow.ruleengine import validate_rules_syntax
          config = load_bootstrap_config('config/policy-config.json')
          validate_rules_syntax(config)
          print(f'policy config v{config.version} valid: {len(config.rules)} rules')
          "

      - name: Unit tests
        run: pytest tests/unit -v --cov=services --cov-report=term-missing

      - name: Integration tests (real PostgreSQL)
        # The fixtures create and use a dedicated `approvalflow_test` database and
        # refuse to run against a name that does not end with `_test`, so they can
        # never drop the schemas of a database something else is using.
        run: pytest tests/integration -v
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: approvalflow
          POSTGRES_PASSWORD: approvalflow
          POSTGRES_DB: approvalflow
          POSTGRES_TEST_DB: approvalflow_test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI tests
        run: |
          npm --prefix ui ci
          npm --prefix ui test -- --run

  compose:
    name: Compose builds and comes up
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        # scripts/verify.py is standard library only, but `python` is not
        # guaranteed to be on PATH on the runner image.
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build every image
        # Proves M4 still holds: the whole system builds from a clean checkout
        # with no extra files. Runs with the stub LLM provider, so no API key and
        # no rate limit are involved.
        run: docker compose build

      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=stub/' .env
          docker compose up -d
          echo "waiting for the gateway to answer"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "gateway healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "gateway never became healthy"; docker compose ps; docker compose logs --tail=80; exit 1

      - name: Run the four journeys and the anti-cheese guards (D5)
        run: python scripts/verify.py

      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images (CD)
    # N2: once the gates are green, images are built and pushed with no manual
    # step. Only for the two long-lived branches — feature branches are validated
    # by the jobs above but do not publish.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    needs: [quality, compose]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ingestion, agent, router, payment, notification]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-ui:
    name: Publish UI image (CD)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    needs: [quality, compose]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ui:${{ github.sha }}
            ghcr.io/${{ github.repository }}/ui:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
