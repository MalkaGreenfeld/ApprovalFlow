# NGINX API Gateway — the single external entry point (M6).
#
# Nothing else is published to the outside world: the services' own ports exist
# for local debugging and the verification script, and in a real deployment they
# would not be mapped at all.
#
# Rate limiting is per client IP with two zones: a tight one for the write paths
# (submitting and approving) and a looser one for reads, so polling the status
# screen cannot exhaust the budget that protects submission.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Two zones, because a submit and a status poll deserve different budgets.
    limit_req_zone $binary_remote_addr zone=write_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=read_limit:10m  rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Return 429 (not 503) when throttled, so clients can back off correctly.
    limit_req_status 429;
    limit_conn_status 429;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"uri":"$uri","status":$status,"correlation_id":"$http_x_correlation_id",'
      '"request_id":"$request_id","duration_ms":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json_combined;

    # Docker's embedded DNS. `valid=10s` caps how long a resolved address is
    # trusted, which only takes effect for names resolved at *request* time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Upstreams as variables rather than `upstream {}` blocks.
        #
        # An `upstream` block with a static `server name:port` is resolved once,
        # when NGINX starts, and the address is then cached for the life of the
        # process. Restart a backend container and the gateway keeps dialling the
        # old address: every request through it answers 502 until NGINX itself is
        # reloaded, even though the service is healthy. Naming the target in a
        # variable defers resolution to request time, so the `resolver` above is
        # actually consulted and a restarted service is picked up within seconds.
        #
        # The trade-off is losing upstream keepalive, which `upstream {}` provides
        # and this form does not. At this scale a fresh connection per request is
        # a far smaller cost than a gateway that cannot survive a rolling restart.
        set $ingestion_svc    "http://ingestion:8001";
        set $router_svc       "http://router:8003";
        set $notification_svc "http://notification:8005";
        set $ui_svc           "http://ui:3000";

        limit_conn conn_limit 50;
        client_max_body_size 1m;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Correlation-ID, Idempotency-Key" always;
        add_header Access-Control-Expose-Headers "X-Correlation-ID" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Accept an inbound correlation id, or mint one, and pass it upstream so a
        # single request is followable end to end (M14).
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID     $request_id;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # ---- Write paths: tighter limit ------------------------------------
        location = /api/submissions {
            limit_req zone=write_limit burst=20 nodelay;
            proxy_pass $ingestion_svc$request_uri;
        }

        location = /api/auth/token {
            limit_req zone=write_limit burst=10 nodelay;
            proxy_pass $ingestion_svc$request_uri;
        }

        # Answering an information request. Regex location so it takes precedence
        # over the /api/submissions/ prefix below (both go to ingestion, but the
        # write rate limit must apply here).
        location ~ ^/api/submissions/[^/]+/info-response$ {
            limit_req zone=write_limit burst=10 nodelay;
            proxy_pass $ingestion_svc$request_uri;
        }

        # Approver actions.
        location ~ ^/api/approvals/[^/]+/(approve|reject|send-back)$ {
            limit_req zone=write_limit burst=20 nodelay;
            proxy_pass $notification_svc$request_uri;
        }

        # Policy configuration (admin only, enforced by the router itself).
        location /api/admin/ {
            limit_req zone=write_limit burst=10 nodelay;
            proxy_pass $router_svc$request_uri;
        }

        # ---- Read paths ----------------------------------------------------
        location /api/submissions/ {
            limit_req zone=read_limit burst=100 nodelay;
            proxy_pass $ingestion_svc$request_uri;
        }

        location /api/metrics/ {
            limit_req zone=read_limit burst=50 nodelay;
            proxy_pass $ingestion_svc$request_uri;
        }

        location /api/approvals {
            limit_req zone=read_limit burst=50 nodelay;
            proxy_pass $notification_svc$request_uri;
        }

        location /api/approvals/ {
            limit_req zone=read_limit burst=50 nodelay;
            proxy_pass $notification_svc$request_uri;
        }

        # Controller dashboard and the ceiling proof.
        location /api/reports/ {
            limit_req zone=read_limit burst=50 nodelay;
            proxy_pass $router_svc$request_uri;
        }

        # ---- UI ------------------------------------------------------------
        location / {
            limit_req zone=read_limit burst=200 nodelay;
            proxy_pass $ui_svc$request_uri;
            # Vite's dev server uses a websocket for hot reload.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
