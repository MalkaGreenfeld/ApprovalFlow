[pytest]
# `auto` means async tests and async fixtures work without decorating each one,
# which keeps the suite readable now that most of the interesting behaviour is
# async (state store, database, outbox).
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:httpx.*
markers =
    integration: needs a reachable PostgreSQL (skipped automatically otherwise)
