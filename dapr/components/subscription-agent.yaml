apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: agent-submission-received
spec:
  topic: submission.received
  routes:
    default: /events/submission-received
  pubsubname: pubsub
scopes:
  - agent
---
# Re-analysis after an approver's "send back for more information" was answered
# (F5). Same analysis path, now with the question and answer in the prompt.
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: agent-submission-info-provided
spec:
  topic: submission.info_provided
  routes:
    default: /events/submission-info-provided
  pubsubname: pubsub
scopes:
  - agent
